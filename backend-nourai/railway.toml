# Railway config for the API service (Settings → Config-as-code path: /backend-nourai/railway.toml).
# Schema: https://railway.com/railway.schema.json — enum values are UPPERCASE.
[build]
builder = "DOCKERFILE"

[deploy]
# Apply pending migrations before serving; a failed migration fails the deploy
# instead of starting an API against an older schema.
startCommand = "sh -c 'alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT'"
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
