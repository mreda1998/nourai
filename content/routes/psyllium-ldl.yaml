  - {id: bile, role: mechanism, label: More bile acids excreted, plain_label: The liver pulls cholesterol from blood to replace them, reactome: R-HSA-194068}
  - {id: ldl, role: outcome, label: Lower LDL cholesterol}
  - {id: events, role: boundary, label: Fewer heart attacks and strokes}
