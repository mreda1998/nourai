# Railway config for the ingestion worker (Config-as-code path: /backend-nourai/railway.worker.toml).
# Schema: https://railway.com/railway.schema.json — enum values are UPPERCASE.
[build]
builder = "DOCKERFILE"

[deploy]
startCommand = "python -m app.workers.ingestion"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
