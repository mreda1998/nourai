slug: caffeine-sleep
ingredient: Caffeine
domain: sleep_recovery
direction: risk
title: Alert now, awake later
takeaway: >
  Caffeine blocks the adenosine signal that builds sleep pressure. In a
  controlled trial, 100 mg had no measurable effect on sleep, while 400 mg
  disrupted sleep when taken within 12 hours of bedtime — more so the later it
  was taken.
structure: {pdb: 5MZP, ligand: CFF, target: Adenosine A2A receptor}
