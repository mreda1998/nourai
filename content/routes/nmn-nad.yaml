domain: energy_metabolism
direction: mixed
title: More NAD, unproven benefit
takeaway: >
  NMN is a building block of NAD⁺, a molecule cells use to handle energy. In
  trials it reliably raises NAD in the blood — but across 12 trials most
  measures of glucose and cholesterol did not change, and every study had
  quality concerns.
