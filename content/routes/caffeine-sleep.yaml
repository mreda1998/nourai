  - {id: signal, role: mechanism, label: Less adenosine signalling, plain_label: The "sleep pressure" signal is muffled, reactome: R-HSA-417973}
  - {id: sleep, role: outcome, label: Sleep disrupted at 400 mg within 12 h of bedtime}
  - {id: cutoff, role: boundary, label: A safe cutoff for you}
