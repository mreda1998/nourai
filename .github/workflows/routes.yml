name: Reviewed routes

on:
  pull_request:
    paths:
      - "content/routes/**"
      - "backend-nourai/**"
  schedule:
    - cron: "0 6 * * 1"  # Mondays: re-verify published citations
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend-nourai/requirements.txt

      - name: Install
        run: pip install -r backend-nourai/requirements.txt pytest==9.0.3

      - name: Tests
        if: github.event_name != 'schedule'
        working-directory: backend-nourai
        run: python -m pytest tests -q

      - name: Check routes
        id: routes
        run: |
          set +e
          python backend-nourai/scripts/check_routes.py content/routes/*.yaml > route-report.md
          echo "status=$?" >> "$GITHUB_OUTPUT"
          cat route-report.md

      - name: Comment on the pull request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const body = require('fs').readFileSync('route-report.md', 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, body,
            });

      - name: Open a citation-review issue
        if: github.event_name == 'schedule' && steps.routes.outputs.status != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const body = require('fs').readFileSync('route-report.md', 'utf8');
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: 'Published route citations need review',
              labels: ['citation-review'], body,
            });

      - name: Fail on route errors
        if: steps.routes.outputs.status != '0'
        run: exit 1
