slug: psyllium-ldl
ingredient: Psyllium Husk
domain: cardiovascular
direction: supports
title: A gel that lowers LDL
takeaway: >
  Psyllium forms a thick gel in the gut that carries bile acids out; the liver
  then uses cholesterol to make more. Across 28 trials, around 10 g a day
  lowered LDL cholesterol by a modest, consistent amount.
